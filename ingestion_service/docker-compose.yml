services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: finzer-postgres-local

    environment:
      POSTGRES_DB: finzer
      POSTGRES_USER: finzer
      POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "5433:5432"

    volumes:
      - finzer_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finzer -d finzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finzer-rabbitmq-local

    environment:
      RABBITMQ_DEFAULT_USER: finzer
      RABBITMQ_DEFAULT_PASS: "finzer_local_password"
      RABBITMQ_DEFAULT_VHOST: /finzer

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - finzer_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  finzer_postgres_data:
  finzer_rabbitmq_data: